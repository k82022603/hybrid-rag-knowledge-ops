# docker-compose-validate.yml
# Docker Compose 설정 검증 워크플로우
#
# 목적:
#   - WSL2 호환성 문제 재발 방지
#   - Healthcheck 설정 유효성 검증
#
# 관련 문서:
#   - 장애 보고서: INC-2026-01-25-001
#   - 인프라 설계서 13.6절: WSL2 개발 환경 설정
#
# Created: 2026-01-25

name: Docker Compose Validate

on:
  push:
    paths:
      - 'infrastructure/docker/docker-compose*.yml'
      - '.github/workflows/docker-compose-validate.yml'
  pull_request:
    paths:
      - 'infrastructure/docker/docker-compose*.yml'
      - '.github/workflows/docker-compose-validate.yml'

jobs:
  validate:
    name: Validate Docker Compose Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Validate YAML syntax
        run: |
          echo "=== YAML Syntax Validation ==="
          for file in infrastructure/docker/docker-compose*.yml; do
            echo "Checking: $file"
            python -c "import yaml; yaml.safe_load(open('$file'))" && echo "  ✅ Valid YAML"
          done

      - name: Validate Docker Compose
        run: |
          echo "=== Docker Compose Validation ==="
          cd infrastructure/docker

          # 기본 설정 검증
          docker compose -f docker-compose.yml config --quiet && echo "✅ docker-compose.yml is valid"

          # WSL2 프로파일 검증
          if [ -f docker-compose.wsl2.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.wsl2.yml config --quiet && \
              echo "✅ WSL2 profile is valid"
          fi

      - name: Check healthcheck settings
        run: |
          echo "=== Healthcheck Settings Validation ==="
          python << 'EOF'
          import yaml
          import sys

          errors = []
          warnings = []

          # 검증 대상 파일
          files = [
              'infrastructure/docker/docker-compose.yml',
              'infrastructure/docker/docker-compose.wsl2.yml'
          ]

          for filepath in files:
              try:
                  with open(filepath) as f:
                      data = yaml.safe_load(f)
              except FileNotFoundError:
                  continue
              except yaml.YAMLError as e:
                  errors.append(f"{filepath}: YAML parse error - {e}")
                  continue

              services = data.get('services', {})

              for svc_name, svc_config in services.items():
                  if not svc_config:
                      continue

                  healthcheck = svc_config.get('healthcheck', {})
                  if not healthcheck:
                      continue

                  test = healthcheck.get('test', [])
                  if not test:
                      continue

                  # test가 리스트인 경우 문자열로 변환
                  if isinstance(test, list):
                      test_str = ' '.join(test)
                  else:
                      test_str = str(test)

                  # 검증 규칙 1: localhost 대신 127.0.0.1 사용
                  if 'localhost' in test_str.lower():
                      errors.append(
                          f"{filepath} - {svc_name}: "
                          f"healthcheck uses 'localhost' instead of '127.0.0.1' "
                          f"(BusyBox compatibility issue)"
                      )

                  # 검증 규칙 2: wget --spider 대신 wget -q -O /dev/null 사용
                  if '--spider' in test_str:
                      warnings.append(
                          f"{filepath} - {svc_name}: "
                          f"healthcheck uses 'wget --spider' which may not work in BusyBox. "
                          f"Consider using 'wget -q -O /dev/null' instead"
                      )

          # 결과 출력
          if warnings:
              print("⚠️  Warnings:")
              for w in warnings:
                  print(f"  - {w}")
              print()

          if errors:
              print("❌ Errors:")
              for e in errors:
                  print(f"  - {e}")
              print()
              print("💡 See: knowledge_service/docs/02_design/infrastructure_detailed_design.md#136-wsl2-개발-환경-설정")
              sys.exit(1)

          print("✅ All healthcheck settings are valid")
          EOF

      - name: Check security settings documentation
        run: |
          echo "=== Security Settings Check ==="
          python << 'EOF'
          import yaml

          # WSL2 호환성 체크 (경고만, 실패 아님)
          security_settings = ['cap_drop', 'cap_add', 'read_only', 'security_opt']

          with open('infrastructure/docker/docker-compose.yml') as f:
              data = yaml.safe_load(f)

          services = data.get('services', {})
          has_security = []

          for svc_name, svc_config in services.items():
              if not svc_config:
                  continue
              for setting in security_settings:
                  if setting in svc_config and svc_config[setting]:
                      has_security.append(f"{svc_name}: {setting}")

          if has_security:
              print("ℹ️  Services with security settings (may need WSL2 override):")
              for item in has_security:
                  print(f"  - {item}")
              print()
              print("💡 Use docker-compose.wsl2.yml to override these for WSL2 development")
          else:
              print("✅ No security settings requiring WSL2 override")
          EOF

      - name: Summary
        run: |
          echo ""
          echo "=== Validation Summary ==="
          echo "✅ YAML syntax: Valid"
          echo "✅ Docker Compose: Valid"
          echo "✅ Healthcheck: Valid"
          echo ""
          echo "📚 Documentation:"
          echo "  - Incident Report: knowledge_service/docs/07_maintenance/incidents/2026-01-25_docker_wsl2_permission.md"
          echo "  - Infrastructure Guide: knowledge_service/docs/02_design/infrastructure_detailed_design.md#136"
