# =============================================================================
# Composite Action: Docker Build and Push
# =============================================================================
# Purpose: Reusable action for building and pushing Docker images
# Usage: See README or workflow examples
# =============================================================================

name: 'Docker Build and Push'
description: 'Build and push Docker image with standard configuration'

inputs:
  name:
    description: 'Service name (backend, gateway, frontend, ai-service)'
    required: true
  context:
    description: 'Docker build context path'
    required: true
  dockerfile:
    description: 'Dockerfile path relative to context'
    required: false
    default: 'Dockerfile'
  registry:
    description: 'Container registry'
    required: false
    default: 'ghcr.io'
  image_prefix:
    description: 'Image prefix (org/repo)'
    required: true
  version:
    description: 'Image version tag'
    required: true
  environment:
    description: 'Target environment (staging, production)'
    required: false
    default: 'staging'
  push:
    description: 'Push image to registry'
    required: false
    default: 'true'
  github_token:
    description: 'GitHub token for registry auth'
    required: true
  platforms:
    description: 'Build platforms'
    required: false
    default: 'linux/amd64'

outputs:
  image:
    description: 'Full image name with tag'
    value: ${{ steps.meta.outputs.tags }}
  digest:
    description: 'Image digest'
    value: ${{ steps.build.outputs.digest }}
  exists:
    description: 'Whether Dockerfile was found'
    value: ${{ steps.check.outputs.exists }}

runs:
  using: 'composite'
  steps:
    - name: Check Dockerfile exists
      id: check
      shell: bash
      run: |
        DOCKERFILE_PATH="${{ inputs.context }}/${{ inputs.dockerfile }}"
        if [ -f "$DOCKERFILE_PATH" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Dockerfile found at $DOCKERFILE_PATH"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "::notice::Dockerfile not found at $DOCKERFILE_PATH, skipping build"
        fi

    - name: Set up Docker Buildx
      if: steps.check.outputs.exists == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: steps.check.outputs.exists == 'true' && inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Extract metadata
      if: steps.check.outputs.exists == 'true'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.image_prefix }}/${{ inputs.name }}
        tags: |
          type=raw,value=${{ inputs.version }}
          type=raw,value=${{ inputs.environment }}
          type=sha,prefix=sha-

    - name: Build and Push
      if: steps.check.outputs.exists == 'true'
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: ${{ inputs.platforms }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VCS_REF=${{ github.sha }}
          VERSION=${{ inputs.version }}
          ENVIRONMENT=${{ inputs.environment }}
