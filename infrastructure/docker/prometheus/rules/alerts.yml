# =============================================================================
# Prometheus Alert Rules - Knowledge Platform
# =============================================================================

groups:
  - name: container-health
    rules:
      # Container down alert
      - alert: ContainerDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.job }} is down"
          description: "Container {{ $labels.job }} has been down for more than 1 minute."

      # High restart count
      - alert: ContainerHighRestartCount
        expr: increase(container_restart_count[1h]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is restarting frequently"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last hour."

  - name: resource-usage
    rules:
      # High CPU usage
      - alert: HighCpuUsage
        expr: (rate(process_cpu_seconds_total[5m]) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.job }}"
          description: "CPU usage is above 80% for {{ $labels.job }}."

      # High memory usage
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024 / 1024) > 6
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: "Memory usage is above 6GB for {{ $labels.job }}."

  - name: application-health
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job)
          /
          sum(rate(http_server_requests_seconds_count[5m])) by (job)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate is above 5% for {{ $labels.job }}."

      # High latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency on {{ $labels.job }}"
          description: "P95 latency is above 2 seconds for {{ $labels.job }}."

      # Low request throughput
      - alert: LowThroughput
        expr: sum(rate(http_server_requests_seconds_count[5m])) by (job) < 0.1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Low request throughput on {{ $labels.job }}"
          description: "Request throughput is very low for {{ $labels.job }}."

  - name: database-health
    rules:
      # Elasticsearch cluster health
      - alert: ElasticsearchClusterRed
        expr: elasticsearch_cluster_health_status{color="red"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Elasticsearch cluster is RED"
          description: "Elasticsearch cluster health is RED. Immediate attention required."

      # Neo4j connection issues
      - alert: Neo4jConnectionFailure
        expr: up{job="neo4j"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Neo4j is unreachable"
          description: "Cannot connect to Neo4j database."

  - name: ai-service
    rules:
      # AI service high latency
      - alert: AIServiceHighLatency
        expr: histogram_quantile(0.95, rate(ai_request_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI Service response time is high"
          description: "AI Service P95 latency is above 30 seconds."

      # DeepSeek API errors
      - alert: DeepSeekAPIErrors
        expr: rate(deepseek_api_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DeepSeek API errors detected"
          description: "DeepSeek API is returning errors."
