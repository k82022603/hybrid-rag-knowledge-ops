# =============================================================================
# AlertManager Configuration - Knowledge Platform
# =============================================================================
# Version: 1.0.0
# Created: 2026-02-04
# Description: Alert routing and notification configuration with Slack integration
# =============================================================================

global:
  # Time to wait before sending notification that alert is resolved
  resolve_timeout: 5m

  # Slack webhook URL (set via environment variable)
  slack_api_url: '${SLACK_WEBHOOK_URL}'

  # SMTP configuration for email alerts (optional)
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'alertmanager@knowledge-platform.com'
  # smtp_auth_username: '${SMTP_USERNAME}'
  # smtp_auth_password: '${SMTP_PASSWORD}'

# Templates for notification messages
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# =============================================================================
# ROUTING CONFIGURATION
# =============================================================================
route:
  # Default grouping
  group_by: ['alertname', 'severity', 'category']

  # Wait time before first notification
  group_wait: 30s

  # Wait time before sending new notification for same group
  group_interval: 5m

  # Wait time before resending notification
  repeat_interval: 4h

  # Default receiver
  receiver: 'default-slack'

  # Route hierarchy
  routes:
    # ---------------------------------------------------------------------------
    # Critical alerts -> Page + Slack (immediate)
    # ---------------------------------------------------------------------------
    - match:
        severity: critical
      receiver: 'critical-pager'
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      continue: true  # Also send to other matching routes

    - match:
        page: "true"
      receiver: 'critical-pager'
      group_wait: 0s
      repeat_interval: 30m

    # ---------------------------------------------------------------------------
    # Database alerts -> Database team Slack channel
    # ---------------------------------------------------------------------------
    - match:
        category: database
      receiver: 'database-slack'
      group_by: ['alertname', 'job']

    # ---------------------------------------------------------------------------
    # AI Service alerts -> AI team Slack channel
    # ---------------------------------------------------------------------------
    - match:
        category: ai
      receiver: 'ai-service-slack'
      group_by: ['alertname']

    # ---------------------------------------------------------------------------
    # Security alerts -> Security team + alerts channel
    # ---------------------------------------------------------------------------
    - match:
        category: security
      receiver: 'security-slack'
      group_wait: 0s
      repeat_interval: 30m

    # ---------------------------------------------------------------------------
    # SLA alerts -> Leadership + DevOps
    # ---------------------------------------------------------------------------
    - match:
        category: sla
      receiver: 'sla-slack'
      group_by: ['alertname']
      repeat_interval: 2h

    # ---------------------------------------------------------------------------
    # Warning alerts -> Standard Slack channel
    # ---------------------------------------------------------------------------
    - match:
        severity: warning
      receiver: 'warning-slack'
      group_interval: 10m
      repeat_interval: 6h

    # ---------------------------------------------------------------------------
    # Info alerts -> Low priority channel
    # ---------------------------------------------------------------------------
    - match:
        severity: info
      receiver: 'info-slack'
      group_interval: 30m
      repeat_interval: 24h

# =============================================================================
# RECEIVERS CONFIGURATION
# =============================================================================
receivers:
  # ---------------------------------------------------------------------------
  # Default Slack receiver
  # ---------------------------------------------------------------------------
  - name: 'default-slack'
    slack_configs:
      - channel: '#proj-hrkp-alerts'
        username: 'AlertManager'
        icon_emoji: ':bell:'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        title_link: 'http://grafana.localhost:3001/alerting/list'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          *Description:* {{ .Annotations.description }}
          {{ if .Labels.instance }}*Instance:* {{ .Labels.instance }}{{ end }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else if eq .CommonLabels.severity "warning" }}warning{{ else }}#439FE0{{ end }}{{ else }}good{{ end }}'

  # ---------------------------------------------------------------------------
  # Critical alerts with paging
  # ---------------------------------------------------------------------------
  - name: 'critical-pager'
    slack_configs:
      - channel: '#proj-hrkp-alerts'
        username: 'CRITICAL ALERT'
        icon_emoji: ':rotating_light:'
        send_resolved: true
        title: ':rotating_light: CRITICAL: {{ .GroupLabels.alertname }}'
        text: >-
          <!channel>
          {{ range .Alerts }}
          *CRITICAL ALERT*
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
        color: 'danger'
    # PagerDuty integration (optional)
    # pagerduty_configs:
    #   - service_key: '${PAGERDUTY_SERVICE_KEY}'
    #     severity: critical
    #     description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'
    #     details:
    #       firing: '{{ template "pagerduty.default.instances" .Alerts.Firing }}'

  # ---------------------------------------------------------------------------
  # Database team alerts
  # ---------------------------------------------------------------------------
  - name: 'database-slack'
    slack_configs:
      - channel: '#proj-hrkp-alerts'
        username: 'Database Monitor'
        icon_emoji: ':database:'
        send_resolved: true
        title: ':database: Database Alert: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Service:* {{ .Labels.job }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'

  # ---------------------------------------------------------------------------
  # AI Service team alerts
  # ---------------------------------------------------------------------------
  - name: 'ai-service-slack'
    slack_configs:
      - channel: '#proj-hrkp-alerts'
        username: 'AI Service Monitor'
        icon_emoji: ':robot_face:'
        send_resolved: true
        title: ':robot_face: AI Service Alert: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'

  # ---------------------------------------------------------------------------
  # Security alerts
  # ---------------------------------------------------------------------------
  - name: 'security-slack'
    slack_configs:
      - channel: '#proj-hrkp-alerts'
        username: 'Security Alert'
        icon_emoji: ':lock:'
        send_resolved: true
        title: ':lock: SECURITY ALERT: {{ .GroupLabels.alertname }}'
        text: >-
          <!channel>
          {{ range .Alerts }}
          *Security Event Detected*
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          {{ if .Labels.source_ip }}*Source IP:* {{ .Labels.source_ip }}{{ end }}
          {{ end }}
        color: 'danger'

  # ---------------------------------------------------------------------------
  # SLA alerts
  # ---------------------------------------------------------------------------
  - name: 'sla-slack'
    slack_configs:
      - channel: '#proj-hrkp-alerts'
        username: 'SLA Monitor'
        icon_emoji: ':chart_with_upwards_trend:'
        send_resolved: true
        title: ':chart_with_upwards_trend: SLA Alert: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *SLA/SLO Alert*
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Impact:* Service level objectives may be at risk
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # ---------------------------------------------------------------------------
  # Warning level alerts
  # ---------------------------------------------------------------------------
  - name: 'warning-slack'
    slack_configs:
      - channel: '#proj-hrkp-alerts'
        username: 'Warning Monitor'
        icon_emoji: ':warning:'
        send_resolved: true
        title: ':warning: Warning: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: 'warning'

  # ---------------------------------------------------------------------------
  # Info level alerts (low priority)
  # ---------------------------------------------------------------------------
  - name: 'info-slack'
    slack_configs:
      - channel: '#proj-hrkp-dev'
        username: 'Info Monitor'
        icon_emoji: ':information_source:'
        send_resolved: false
        title: ':information_source: Info: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: '#439FE0'

# =============================================================================
# INHIBITION RULES
# =============================================================================
# Prevent notification storm by suppressing lower severity alerts
# when higher severity alerts are firing

inhibit_rules:
  # If Critical fires, suppress Warning for same alertname/job
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']

  # If Critical fires, suppress Info for same alertname/job
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'info'
    equal: ['alertname', 'job']

  # If Warning fires, suppress Info for same alertname/job
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'job']

  # If container is down, suppress resource alerts for that container
  - source_match:
      alertname: 'ContainerDown'
    target_match_re:
      alertname: 'High.*Usage'
    equal: ['job']

  # If database is down, suppress database performance alerts
  - source_match_re:
      alertname: '.*Down$'
    target_match_re:
      alertname: '.*High.*|.*Slow.*'
    equal: ['job']
