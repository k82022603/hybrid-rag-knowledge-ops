# =============================================================================
# AlertManager Configuration - Knowledge Platform
# =============================================================================
# Version: 2.0.0
# Updated: 2026-03-05
# Description: Alert routing with team-based Slack channel separation
#   - proj-hrkp-alerts: DB, AI, Security, Infra, Critical alerts
#   - proj-hrkp-dev: Default/info/warning alerts
# =============================================================================

global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

# =============================================================================
# ROUTING CONFIGURATION
# =============================================================================
route:
  group_by: ['alertname', 'severity', 'category']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-slack'

  routes:
    # -------------------------------------------------------------------------
    # Critical severity -> proj-hrkp-alerts (immediate)
    # -------------------------------------------------------------------------
    - match:
        severity: critical
      receiver: 'critical-slack'
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      continue: true

    # -------------------------------------------------------------------------
    # Database alerts (by job) -> proj-hrkp-alerts
    # -------------------------------------------------------------------------
    - match_re:
        job: 'postgresql|neo4j|elasticsearch'
      receiver: 'database-slack'
      group_by: ['alertname', 'job']

    # -------------------------------------------------------------------------
    # Database alerts (by category) -> proj-hrkp-alerts
    # -------------------------------------------------------------------------
    - match:
        category: database
      receiver: 'database-slack'
      group_by: ['alertname', 'job']

    # -------------------------------------------------------------------------
    # AI Service alerts (by job) -> proj-hrkp-alerts
    # -------------------------------------------------------------------------
    - match:
        job: ai-service
      receiver: 'ai-service-slack'
      group_by: ['alertname']

    # -------------------------------------------------------------------------
    # AI Service alerts (by category) -> proj-hrkp-alerts
    # -------------------------------------------------------------------------
    - match:
        category: ai
      receiver: 'ai-service-slack'
      group_by: ['alertname']

    # -------------------------------------------------------------------------
    # Security alerts (by alertname regex) -> proj-hrkp-alerts
    # -------------------------------------------------------------------------
    - match_re:
        alertname: 'Security.*'
      receiver: 'security-slack'
      group_wait: 0s
      repeat_interval: 30m

    # -------------------------------------------------------------------------
    # Security alerts (by category) -> proj-hrkp-alerts
    # -------------------------------------------------------------------------
    - match:
        category: security
      receiver: 'security-slack'
      group_wait: 0s
      repeat_interval: 30m

    # -------------------------------------------------------------------------
    # Infrastructure alerts -> proj-hrkp-alerts
    # -------------------------------------------------------------------------
    - match:
        category: infra
      receiver: 'infra-slack'
      group_by: ['alertname', 'job']

    # -------------------------------------------------------------------------
    # SLA alerts -> proj-hrkp-alerts
    # -------------------------------------------------------------------------
    - match:
        category: sla
      receiver: 'sla-slack'
      group_by: ['alertname']
      repeat_interval: 2h

    # -------------------------------------------------------------------------
    # Warning alerts -> proj-hrkp-dev
    # -------------------------------------------------------------------------
    - match:
        severity: warning
      receiver: 'warning-slack'
      group_interval: 10m
      repeat_interval: 6h

    # -------------------------------------------------------------------------
    # Info alerts -> proj-hrkp-dev (low priority)
    # -------------------------------------------------------------------------
    - match:
        severity: info
      receiver: 'info-slack'
      group_interval: 30m
      repeat_interval: 24h

# =============================================================================
# RECEIVERS CONFIGURATION
# =============================================================================
receivers:
  # ---------------------------------------------------------------------------
  # Default -> proj-hrkp-dev
  # ---------------------------------------------------------------------------
  - name: 'default-slack'
    slack_configs:
      - channel: '#proj-hrkp-dev'
        username: 'AlertManager'
        icon_emoji: ':bell:'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        title_link: 'http://grafana.localhost:3001/alerting/list'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          *Description:* {{ .Annotations.description }}
          {{ if .Labels.instance }}*Instance:* {{ .Labels.instance }}{{ end }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else if eq .CommonLabels.severity "warning" }}warning{{ else }}#439FE0{{ end }}{{ else }}good{{ end }}'

  # ---------------------------------------------------------------------------
  # Critical -> proj-hrkp-alerts
  # ---------------------------------------------------------------------------
  - name: 'critical-slack'
    slack_configs:
      - channel: '#proj-hrkp-alerts'
        username: 'CRITICAL ALERT'
        icon_emoji: ':rotating_light:'
        send_resolved: true
        title: ':rotating_light: CRITICAL: {{ .GroupLabels.alertname }}'
        text: >-
          <!channel>
          {{ range .Alerts }}
          *CRITICAL ALERT*
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
        color: 'danger'

  # ---------------------------------------------------------------------------
  # Database -> proj-hrkp-alerts
  # ---------------------------------------------------------------------------
  - name: 'database-slack'
    slack_configs:
      - channel: '#proj-hrkp-alerts'
        username: 'Database Monitor'
        icon_emoji: ':database:'
        send_resolved: true
        title: ':database: Database Alert: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Service:* {{ .Labels.job }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'

  # ---------------------------------------------------------------------------
  # AI Service -> proj-hrkp-alerts
  # ---------------------------------------------------------------------------
  - name: 'ai-service-slack'
    slack_configs:
      - channel: '#proj-hrkp-alerts'
        username: 'AI Service Monitor'
        icon_emoji: ':robot_face:'
        send_resolved: true
        title: ':robot_face: AI Service Alert: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'

  # ---------------------------------------------------------------------------
  # Security -> proj-hrkp-alerts
  # ---------------------------------------------------------------------------
  - name: 'security-slack'
    slack_configs:
      - channel: '#proj-hrkp-alerts'
        username: 'Security Alert'
        icon_emoji: ':lock:'
        send_resolved: true
        title: ':lock: SECURITY ALERT: {{ .GroupLabels.alertname }}'
        text: >-
          <!channel>
          {{ range .Alerts }}
          *Security Event Detected*
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          {{ if .Labels.source_ip }}*Source IP:* {{ .Labels.source_ip }}{{ end }}
          {{ end }}
        color: 'danger'

  # ---------------------------------------------------------------------------
  # Infrastructure -> proj-hrkp-alerts
  # ---------------------------------------------------------------------------
  - name: 'infra-slack'
    slack_configs:
      - channel: '#proj-hrkp-alerts'
        username: 'Infra Monitor'
        icon_emoji: ':gear:'
        send_resolved: true
        title: ':gear: Infra Alert: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Service:* {{ .Labels.job }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'

  # ---------------------------------------------------------------------------
  # SLA -> proj-hrkp-alerts
  # ---------------------------------------------------------------------------
  - name: 'sla-slack'
    slack_configs:
      - channel: '#proj-hrkp-alerts'
        username: 'SLA Monitor'
        icon_emoji: ':chart_with_upwards_trend:'
        send_resolved: true
        title: ':chart_with_upwards_trend: SLA Alert: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *SLA/SLO Alert*
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Impact:* Service level objectives may be at risk
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # ---------------------------------------------------------------------------
  # Warning -> proj-hrkp-dev
  # ---------------------------------------------------------------------------
  - name: 'warning-slack'
    slack_configs:
      - channel: '#proj-hrkp-dev'
        username: 'Warning Monitor'
        icon_emoji: ':warning:'
        send_resolved: true
        title: ':warning: Warning: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: 'warning'

  # ---------------------------------------------------------------------------
  # Info -> proj-hrkp-dev (low priority)
  # ---------------------------------------------------------------------------
  - name: 'info-slack'
    slack_configs:
      - channel: '#proj-hrkp-dev'
        username: 'Info Monitor'
        icon_emoji: ':information_source:'
        send_resolved: false
        title: ':information_source: Info: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: '#439FE0'

# =============================================================================
# INHIBITION RULES
# =============================================================================
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']

  - source_match:
      severity: 'critical'
    target_match:
      severity: 'info'
    equal: ['alertname', 'job']

  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'job']

  - source_match:
      alertname: 'ContainerDown'
    target_match_re:
      alertname: 'High.*Usage'
    equal: ['job']

  - source_match_re:
      alertname: '.*Down$'
    target_match_re:
      alertname: '.*High.*|.*Slow.*'
    equal: ['job']
