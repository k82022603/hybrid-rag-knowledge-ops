# =============================================================================
# Hybrid RAG Knowledge Platform - Docker Compose (18 Containers)
# =============================================================================
# Version: 1.3.0
# Created: 2026-01-20
# Updated: 2026-01-30 - Keycloak realm 설정 통일 (hybrid-rag), Frontend 환경변수 추가
# Description: Complete development environment with 18 containers
# Security: read_only, no-new-privileges, cap_drop, non-root user
# =============================================================================

name: knowledge-platform

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  frontend:
    driver: bridge
    name: kp-frontend
  backend:
    driver: bridge
    name: kp-backend
  database:
    driver: bridge
    # internal: true  # Enable in production for additional isolation
    name: kp-database
  monitoring:
    driver: bridge
    name: kp-monitoring

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgresql_data:
    name: kp-postgresql-data
  keycloak_db_data:
    name: kp-keycloak-db-data
  neo4j_data:
    name: kp-neo4j-data
  elasticsearch_data:
    name: kp-elasticsearch-data
  redis_data:
    name: kp-redis-data
  minio_data:
    name: kp-minio-data
  prometheus_data:
    name: kp-prometheus-data
  grafana_data:
    name: kp-grafana-data
  loki_data:
    name: kp-loki-data
  # Temporary volumes for read_only containers
  nginx_tmp:
    name: kp-nginx-tmp
  nginx_cache:
    name: kp-nginx-cache
  redis_tmp:
    name: kp-redis-tmp
  prometheus_tmp:
    name: kp-prometheus-tmp

# =============================================================================
# SERVICES (18 Containers)
# =============================================================================
services:

  # ===========================================================================
  # APPLICATION LAYER (5 containers)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 1. Nginx - Reverse Proxy & Load Balancer
  # ---------------------------------------------------------------------------
  # WSL2 Fix: bind mount -> build image (설정 파일을 Dockerfile에서 COPY)
  nginx:
    image: ${REGISTRY:-}knowledge-platform/nginx:${VERSION:-latest}
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: kp-nginx
    restart: unless-stopped
    # Security settings
    # user: "101:101"  # nginx user in alpine - WSL2
    # read_only: true  # WSL2
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    # cap_add:  # WSL2
      # - NET_BIND_SERVICE  # WSL2
      # - CHOWN  # WSL2
      # - SETUID  # WSL2
      # - SETGID  # WSL2
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    # WSL2 Fix: bind mount 제거 - 설정은 Dockerfile에서 COPY됨
    volumes:
      - nginx_tmp:/tmp
      - nginx_cache:/var/cache/nginx
    # tmpfs:  # WSL2
      # - /var/run:mode=755  # WSL2
    networks:
      - frontend
    depends_on:
      frontend:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # 2. Frontend - React Application
  # ---------------------------------------------------------------------------
  frontend:
    image: ${REGISTRY:-}knowledge-platform/frontend:${VERSION:-latest}
    build:
      context: ../../knowledge_service/frontend
      dockerfile: Dockerfile
    container_name: kp-frontend
    restart: unless-stopped
    # Security settings
    # user: "101:101"  # nginx user serving static files - WSL2
    # read_only: true  # WSL2
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    # cap_add:  # WSL2
      # - NET_BIND_SERVICE  # WSL2
    # tmpfs:  # WSL2
      # - /tmp:mode=755  # WSL2
      # - /var/run:mode=755  # WSL2
      # - /var/cache/nginx:mode=755  # WSL2
    networks:
      - frontend
    environment:
      - VITE_API_URL=${API_URL:-http://127.0.0.1:8080/api}
      - VITE_API_BASE_URL=${API_URL:-http://127.0.0.1:8080}
      - VITE_AUTH_URL=${AUTH_URL:-http://localhost:8180}
      - VITE_WS_URL=${WS_URL:-ws://localhost:8080/ws}
      # Keycloak Configuration (aligned with realm-export.json)
      - VITE_KEYCLOAK_URL=${KEYCLOAK_EXTERNAL_URL:-http://localhost:8180}
      - VITE_KEYCLOAK_REALM=${KEYCLOAK_REALM:-hybrid-rag}
      - VITE_KEYCLOAK_CLIENT_ID=${KEYCLOAK_FRONTEND_CLIENT:-knowledge-frontend}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # 3. API Gateway - Spring Cloud Gateway
  # ---------------------------------------------------------------------------
  api-gateway:
    image: ${REGISTRY:-}knowledge-platform/api-gateway:${VERSION:-latest}
    build:
      context: ../../knowledge_service/gateway
      dockerfile: Dockerfile
    container_name: kp-api-gateway
    restart: unless-stopped
    # Security settings
    # user: "1000:1000"  # Non-root user - WSL2
    # read_only: true  # WSL2
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    # tmpfs:  # WSL2
      # - /tmp:mode=755  # WSL2
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - frontend
      - backend
      - database  # Added for Redis access (Rate Limiter)
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE:-docker}
      - SERVER_PORT=8080
      - BACKEND_URL=http://backend:8081
      - AI_SERVICE_URL=http://ai-service:8000
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-hybrid-rag}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    depends_on:
      keycloak:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # 4. Backend - Spring Boot Application
  # ---------------------------------------------------------------------------
  backend:
    image: ${REGISTRY:-}knowledge-platform/backend:${VERSION:-latest}
    build:
      context: ../../knowledge_service/backend
      dockerfile: Dockerfile
    container_name: kp-backend
    restart: unless-stopped
    # Security settings
    # user: "1000:1000"  # Non-root user - WSL2
    # read_only: true  # WSL2
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    # tmpfs:  # WSL2
      # - /tmp:mode=755  # WSL2
    ports:
      - "8081:8081"
    networks:
      - backend
      - database
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE:-docker}
      - SERVER_PORT=8081
      - DATABASE_URL=jdbc:postgresql://postgresql:5432/${DB_NAME:-knowledge}
      - DATABASE_USERNAME=${DB_USERNAME:-knowledge}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - AI_SERVICE_URL=http://ai-service:8000
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-documents}
      - JWT_SECRET=${JWT_SECRET}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-hybrid-rag}
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          memory: 1G

  # ---------------------------------------------------------------------------
  # 5. AI Service - FastAPI (Python)
  # ---------------------------------------------------------------------------
  ai-service:
    image: ${REGISTRY:-}knowledge-platform/ai-service:${VERSION:-latest}
    build:
      context: ../../knowledge_service
      dockerfile: Dockerfile
    container_name: kp-ai-service
    restart: unless-stopped
    # Security settings
    # user: "1000:1000"  # Non-root user - WSL2
    # read_only: true  # WSL2
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    # tmpfs:  # WSL2
      # - /tmp:mode=755  # WSL2
    ports:
      - "8000:8000"
    networks:
      - backend
      - database
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - REDIS_URL=redis://redis:6379
      - POSTGRESQL_URL=postgresql://${DB_USERNAME:-knowledge}:${DB_PASSWORD}@postgresql:5432/${DB_NAME:-knowledge}
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          memory: 4G

  # ===========================================================================
  # AUTH LAYER (2 containers)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 6. Keycloak - OAuth 2.0 / OIDC Provider
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: kp-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    # Security settings (Keycloak needs specific permissions)
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    # cap_add:  # WSL2
      # - NET_BIND_SERVICE  # WSL2
    # tmpfs:  # WSL2
      # - /tmp:mode=755  # WSL2
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    networks:
      - frontend
      - database
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER:-keycloak}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_HOSTNAME=${KEYCLOAK_HOSTNAME:-localhost}
      - KC_HOSTNAME_PORT=${KEYCLOAK_PORT:-8180}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
      - KC_PROXY=edge
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      # Keycloak 23.0+ imports all JSON files from /opt/keycloak/data/import/
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/hybrid-rag-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # 7. Keycloak DB - PostgreSQL for Keycloak
  # ---------------------------------------------------------------------------
  keycloak-db:
    image: postgres:16-alpine
    container_name: kp-keycloak-db
    restart: unless-stopped
    # Security settings (DB needs write access, no read_only)
    user: "70:70"  # postgres user in alpine
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    # cap_add:  # WSL2
      # - CHOWN  # WSL2
      # - SETUID  # WSL2
      # - SETGID  # WSL2
      # - FOWNER  # WSL2
      # - DAC_OVERRIDE  # WSL2
    networks:
      - database
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KEYCLOAK_DB_USER:-keycloak}
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M

  # ===========================================================================
  # DATA LAYER (5 containers)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 8. PostgreSQL - Main Database (SSOT)
  # ---------------------------------------------------------------------------
  postgresql:
    image: postgres:16-alpine
    container_name: kp-postgresql
    restart: unless-stopped
    # Security settings (DB needs write access, no read_only)
    user: "70:70"  # postgres user in alpine
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    # cap_add:  # WSL2
      # - CHOWN  # WSL2
      # - SETUID  # WSL2
      # - SETGID  # WSL2
      # - FOWNER  # WSL2
      # - DAC_OVERRIDE  # WSL2
    networks:
      - database
    environment:
      - POSTGRES_DB=${DB_NAME:-knowledge}
      - POSTGRES_USER=${DB_USERNAME:-knowledge}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./scripts/init-postgresql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../database/postgres/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=256MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-knowledge} -d ${DB_NAME:-knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          memory: 2G

  # ---------------------------------------------------------------------------
  # 9. Neo4j - Knowledge Graph Database
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.15-community
    container_name: kp-neo4j
    restart: unless-stopped
    # Security settings (DB needs write access, no read_only)
    # user: "7474:7474"  # neo4j user - WSL2
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    networks:
      - database
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_security_auth__minimum__password__length=4
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    ports:
      - "${NEO4J_BROWSER_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - ../database/neo4j/schema.cypher:/import/schema.cypher:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          memory: 2G

  # ---------------------------------------------------------------------------
  # 10. Elasticsearch - Vector Search & Text Search
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: kp-elasticsearch
    restart: unless-stopped
    # Security settings (ES needs write access, no read_only)
    user: "1000:1000"  # elasticsearch user
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    # cap_add:  # WSL2
      # - IPC_LOCK  # Required for memory locking - WSL2
    networks:
      - database
    environment:
      - node.name=kp-es01
      - cluster.name=knowledge-platform-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.ml.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - bootstrap.memory_lock=true
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ../database/elasticsearch/mappings.json:/usr/share/elasticsearch/config/mappings.json:ro
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          memory: 2G

  # ---------------------------------------------------------------------------
  # 10-1. Kibana - Elasticsearch Visualization
  # ---------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kp-kibana
    restart: unless-stopped
    # Security settings
    # user: "1000:1000"  # kibana user - WSL2
    # read_only: true  # WSL2
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    # tmpfs:  # WSL2
      # - /tmp:mode=755  # WSL2
      # - /usr/share/kibana/data:mode=755  # WSL2
    networks:
      - database
      - monitoring
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q 'available'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # 11. Redis - Cache & Session Store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: kp-redis
    restart: unless-stopped
    # Security settings (Redis needs write for persistence)
    # user: "999:999"  # redis user - WSL2
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    command: >
      redis-server
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    networks:
      - database
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # 12. MinIO - Object Storage (S3 Compatible)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: kp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # Security settings (MinIO needs write access)
    # user: "1000:1000"  # minio user - WSL2
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    networks:
      - database
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          memory: 512M

  # ===========================================================================
  # OBSERVABILITY LAYER (5 containers)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 13. Prometheus - Metrics Collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: kp-prometheus
    restart: unless-stopped
    # Security settings
    user: "65534:65534"  # nobody user
    # read_only: true  # WSL2
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - monitoring
      - backend
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    # tmpfs:  # WSL2
      # - /tmp:mode=755  # WSL2
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # 14. Grafana - Visualization & Dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.0
    container_name: kp-grafana
    restart: unless-stopped
    # Security settings (Grafana needs write for plugins/dashboards)
    user: "472:472"  # grafana user
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    networks:
      - monitoring
      - frontend
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_URL:-http://localhost:3001}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # 15. Loki - Log Aggregation
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.0
    container_name: kp-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    # Security settings (Loki needs write for logs)
    user: "10001:10001"  # loki user
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    networks:
      - monitoring
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # 16. Promtail - Log Collection Agent
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.0
    container_name: kp-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    # Security settings
    user: "0:0"  # Needs root to read /var/log
    # read_only: true  # WSL2
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    # cap_add:  # WSL2
      # - DAC_READ_SEARCH  # Required to read log files - WSL2
    # tmpfs:  # WSL2
      # - /tmp:mode=755  # WSL2
    networks:
      - monitoring
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # 17. Jaeger - Distributed Tracing
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: kp-jaeger
    restart: unless-stopped
    # Security settings
    user: "10001:10001"  # jaeger user
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    # tmpfs:  # WSL2
      # - /tmp:mode=755  # WSL2
    networks:
      - monitoring
      - backend
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"      # UI
      - "${JAEGER_COLLECTOR_PORT:-14268}:14268"  # Collector HTTP
      - "6831:6831/udp"                         # Thrift compact
      - "6832:6832/udp"                         # Thrift binary
      - "14250:14250"                           # gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=10000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:14269/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M

  # ===========================================================================
  # UTILITY LAYER (1 container)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 18. Init-DB - Database Initialization
  # ---------------------------------------------------------------------------
  init-db:
    image: python:3.11-slim
    container_name: kp-init-db
    # Security settings
    user: "1000:1000"  # Non-root user
    security_opt:
      - no-new-privileges:true
    # cap_drop:  # WSL2
      # - ALL  # WSL2
    networks:
      - database
    environment:
      - POSTGRESQL_URL=postgresql://${DB_USERNAME:-knowledge}:${DB_PASSWORD}@postgresql:5432/${DB_NAME:-knowledge}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-documents}
    volumes:
      - ./scripts/init-db.py:/app/init-db.py:ro
      - ./scripts/requirements-init.txt:/app/requirements.txt:ro
      - ../database/elasticsearch/mappings.json:/app/es-mappings.json:ro
      - ../database/neo4j/schema.cypher:/app/neo4j-schema.cypher:ro
    working_dir: /app
    command: >
      bash -c "
        pip install -q -r requirements.txt &&
        python init-db.py
      "
    depends_on:
      postgresql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"
    profiles:
      - init
