spring:
  cloud:
    gateway:
      routes: []
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://test-issuer.example.com
          jwk-set-uri: https://test-issuer.example.com/.well-known/jwks.json
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-secret-key-minimum-32-characters-for-hs256-algorithm
  issuer: test-issuer

gateway:
  timeout:
    default: 30
    sse: 300

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: false
