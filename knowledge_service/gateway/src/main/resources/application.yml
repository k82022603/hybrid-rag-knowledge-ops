server:
  port: 8080
  # File Upload Configuration (2GB max)
  max-http-request-header-size: 64KB

spring:
  application:
    name: knowledge-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # File Upload Configuration (2GB max)
  codec:
    max-in-memory-size: 2GB
  webflux:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

  # Cloud Gateway Configuration
  cloud:
    gateway:
      # Metadata-based per-route response timeout support
      # Routes can override via exchange attribute "response-timeout"
      # ==============================================
      # HttpClient Configuration (Connection Pool & Timeouts)
      # SCRUM-62: Netty Channel Error 대응
      # Chat API: 검색(~1s) + Reranker(~33s CPU) + LLM(~30s) ≈ 65s, 여유 포함 180s
      # ==============================================
      httpclient:
        connect-timeout: 10000
        response-timeout: 180s
        pool:
          type: elastic
          max-connections: 500
          acquire-timeout: 45000
          max-idle-time: 20000
          evict-in-background: 30s
        wiretap: false  # 프로덕션에서는 false, 디버깅 시 true

      # CORS is managed by SecurityConfig.corsConfigurationSource() (Java, primary).
      # DedupeResponseHeader prevents duplicate CORS headers when both Spring Security
      # and Gateway filters add them.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      routes:
        # ==============================================
        # Auth Service Routes (/api/auth/** and /api/v1/auth/**)
        # Direct login/logout endpoints (no JWT required for login)
        # ==============================================
        - id: auth-service
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-circuit-breaker
                fallbackUri: forward:/fallback/auth
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: POST
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1

        # Auth Service V1 Routes (/api/v1/auth/**)
        # Same as above but with v1 prefix
        - id: auth-service-v1
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-circuit-breaker
                fallbackUri: forward:/fallback/auth
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: POST
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Document Service Routes (/api/v1/documents/**)
        # Upload, status, list, retry → AI Service
        # ==============================================
        - id: document-service
          uri: ${AI_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/documents/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
                fallbackUri: forward:/fallback/ai-service
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Knowledge Service Routes (/api/v1/knowledge/**)
        # ==============================================
        - id: knowledge-service
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/knowledge/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: knowledge-circuit-breaker
                fallbackUri: forward:/fallback/knowledge
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Search Service Routes (/api/v1/search/**)
        # NOTE: SSE streaming route (/api/v1/search/stream/**) is defined in
        # GatewayRouteConfig.java with 300s extended timeout for LLM streaming.
        # ==============================================

        # Regular search to AI Service
        - id: search-service
          uri: ${AI_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/search/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
                fallbackUri: forward:/fallback/ai-service
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET,POST
                backoff:
                  firstBackoff: 200ms
                  maxBackoff: 1000ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Graph Service Routes (/api/v1/graph/**)
        # Neo4j Knowledge Graph API → AI Service
        # ==============================================
        - id: graph-service
          uri: ${AI_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/graph/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
                fallbackUri: forward:/fallback/ai-service
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET,POST
                backoff:
                  firstBackoff: 200ms
                  maxBackoff: 1000ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # User Service Routes (/api/v1/users/**)
        # ==============================================
        - id: user-service
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: user-circuit-breaker
                fallbackUri: forward:/fallback/user
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Cache Management Routes (/api/v1/cache/**)
        # Redis cache stats, clear, invalidate → AI Service
        # ==============================================
        - id: cache-service
          uri: ${AI_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/cache/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
                fallbackUri: forward:/fallback/ai-service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Backend API Routes (/api/v1/**)
        # Catch-all for other backend endpoints
        # ==============================================
        - id: backend-api
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: backend-circuit-breaker
                fallbackUri: forward:/fallback/backend
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Internal API Routes (/internal/v1/**)
        # REMOVED: Internal API는 Docker 네트워크를 통해 직접 통신해야 합니다.
        # 설계서: "내부 네트워크에서만 접근" 명시 (보안 위험으로 Gateway 노출 제거)
        # Backend/AI Service 간 통신은 kp-backend 네트워크에서 직접 수행
        # Ref: architecture_compliance_review_2026-01-26.md Critical C3
        # ==============================================

        # ==============================================
        # AI Service Direct Routes (/ai/**)
        # Legacy AI service endpoints
        # ==============================================
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/ai/**
          filters:
            - TokenRelay=
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
                fallbackUri: forward:/fallback/ai-service
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET,POST

        # ==============================================
        # Keycloak Auth Routes (/auth/**)
        # ==============================================
        - id: keycloak
          uri: ${KEYCLOAK_URL:http://localhost:8180}
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

  # Redis for Rate Limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # Security (OAuth2)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:hybrid-rag}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:hybrid-rag}/protocol/openid-connect/certs

# JWT Configuration (for self-issued HS256 tokens from Direct Login)
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-generation-minimum-32-characters}
  issuer: ${JWT_ISSUER:knowledge-platform}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# ==============================================
# Gateway Timeout Configuration
# SSE endpoints use extended timeouts for LLM streaming responses
# ==============================================
gateway:
  timeout:
    default: 30     # Standard routes: 30s
    sse: 300        # SSE streaming routes: 300s (LLM streaming)

# ==============================================
# Resilience4j Configuration (per-service tuning)
# STORY-127: Service-specific circuit breaker settings
# ==============================================
resilience4j:
  circuitbreaker:
    configs:
      # Default config for general backend services
      default:
        register-health-indicator: true
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50

      # AI Service config (slow LLM responses allowed)
      ai-service-config:
        register-health-indicator: true
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 30s  # Longer recovery for AI service
        failure-rate-threshold: 50
        slow-call-duration-threshold: 45s  # CPU Reranking 38s allowed
        slow-call-rate-threshold: 90

      # Knowledge Service config (fast response expected)
      knowledge-service-config:
        register-health-indicator: true
        sliding-window-size: 20   # Larger window for better statistics
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 15s  # Quick recovery expected
        failure-rate-threshold: 30  # Stricter: failures are unexpected
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50

    instances:
      auth-circuit-breaker:
        base-config: default
      backend-circuit-breaker:
        base-config: default
      knowledge-circuit-breaker:
        base-config: knowledge-service-config
      user-circuit-breaker:
        base-config: default
      ai-service-circuit-breaker:
        base-config: ai-service-config

  timelimiter:
    configs:
      default:
        timeout-duration: 30s
      ai-timeout:
        timeout-duration: 120s  # Cold start: embedding(46s) + reranking(9s) + LLM(35s) = 91s
    instances:
      auth-circuit-breaker:
        timeout-duration: 15s
      backend-circuit-breaker:
        timeout-duration: 30s
      knowledge-circuit-breaker:
        timeout-duration: 30s
      user-circuit-breaker:
        timeout-duration: 15s
      ai-service-circuit-breaker:
        timeout-duration: 120s  # Cold start: embedding(46s) + reranking(9s) + LLM(35s) = 91s

# ============================================================
# Logging Configuration
# SCRUM-62: Netty/Reactor 로그 최적화
# ============================================================
# 프로필별 로그 레벨:
# - local (기본): 적절한 디버깅 + 노이즈 필터링
# - dev: 상세 디버깅 (application-dev.yml)
# - prod: 최소 로깅 (application-prod.yml)
# ============================================================
logging:
  level:
    # Application Level
    root: INFO
    com.knowledge.gateway: DEBUG

    # Spring Framework
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.filter: INFO
    org.springframework.security: DEBUG

    # ============================================================
    # Netty & Reactor - Optimized for Local Development
    # ============================================================
    # INFO: 연결 이벤트만 로깅 (DEBUG 대신)
    # Channel 에러 노이즈 필터링 적용
    # ============================================================
    reactor.netty: INFO
    reactor.netty.http.client: INFO
    reactor.netty.http.server: INFO
    io.netty: WARN
    io.netty.channel: WARN
    io.netty.handler: WARN

    # Channel Operation 에러 - 노이즈 감소 (WARN → ERROR)
    # Connection reset, Premature close 등 무시
    reactor.netty.channel.ChannelOperationsHandler: ERROR
    reactor.netty.http.client.HttpClientOperations: ERROR

    # Connection Pool - 연결 라이프사이클 모니터링
    reactor.netty.resources.PooledConnectionProvider: INFO
    reactor.netty.resources.DefaultPooledConnectionProvider: WARN

    # Resilience4j
    io.github.resilience4j: INFO
    io.github.resilience4j.circuitbreaker: INFO

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker

  cloud:
    gateway:
      # ==============================================
      # HttpClient Configuration (Docker Profile)
      # SCRUM-62: Netty Channel Error 대응
      # Cold start: 임베딩 모델 로드(46s) + Reranking(9s) + LLM(35s) = 91s 대응
      # ==============================================
      httpclient:
        connect-timeout: 10000
        response-timeout: 120s
        pool:
          type: elastic
          max-connections: 500
          acquire-timeout: 45000
          max-idle-time: 20000
          evict-in-background: 30s
        wiretap: false  # 프로덕션에서는 false

  data:
    redis:
      host: redis

  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri: Token issuer must match what browser sees (localhost:8180)
          # jwk-set-uri: Key fetch uses internal Docker network (keycloak:8080)
          issuer-uri: ${KEYCLOAK_EXTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:hybrid-rag}
          jwk-set-uri: http://keycloak:8080/realms/${KEYCLOAK_REALM:hybrid-rag}/protocol/openid-connect/certs

# CORS Configuration (used by SecurityConfig.corsConfigurationSource())
# Routes reuse default-profile definitions via ${BACKEND_URL} / ${AI_SERVICE_URL} env vars.
# In Docker Compose, set: BACKEND_URL=http://backend:8081, AI_SERVICE_URL=http://ai-service:8000
cors:
  allowed-origins: http://localhost,http://localhost:80,${FRONTEND_URL:http://localhost:3000}

# ============================================================
# SCRUM-62: Netty/Reactor 로그 최적화 (Docker Profile)
# ============================================================
# Docker 환경: 프로덕션에 가까운 로그 레벨 적용
# ============================================================
logging:
  level:
    # Application Level
    root: INFO
    com.knowledge.gateway: INFO

    # Spring Framework
    org.springframework.cloud.gateway: WARN
    org.springframework.cloud.gateway.filter: INFO
    org.springframework.security: WARN

    # Netty & Reactor - Production-like (노이즈 최소화)
    reactor.netty: WARN
    reactor.netty.http.client: WARN
    reactor.netty.http.server: WARN
    io.netty: WARN
    io.netty.channel: ERROR
    io.netty.handler: ERROR

    # Channel Operation 에러 - ERROR only (노이즈 제거)
    reactor.netty.channel.ChannelOperationsHandler: ERROR
    reactor.netty.http.client.HttpClientOperations: ERROR
    reactor.netty.resources.DefaultPooledConnectionProvider: ERROR

    # Connection Pool
    reactor.netty.resources.PooledConnectionProvider: WARN

    # Resilience4j
    io.github.resilience4j: INFO
