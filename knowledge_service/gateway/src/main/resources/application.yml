server:
  port: 8080

spring:
  application:
    name: knowledge-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Cloud Gateway Configuration
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # ==============================================
        # Auth Service Routes (/api/auth/** and /api/v1/auth/**)
        # Direct login/logout endpoints (no JWT required for login)
        # ==============================================
        - id: auth-service
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-circuit-breaker
                fallbackUri: forward:/fallback/auth
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: POST
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1

        # Auth Service V1 Routes (/api/v1/auth/**)
        # Same as above but with v1 prefix
        - id: auth-service-v1
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-circuit-breaker
                fallbackUri: forward:/fallback/auth
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: POST
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Knowledge Service Routes (/api/v1/knowledge/**)
        # ==============================================
        - id: knowledge-service
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/knowledge/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: knowledge-circuit-breaker
                fallbackUri: forward:/fallback/knowledge
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Search Service Routes (/api/v1/search/**)
        # Streaming search to AI Service
        # ==============================================
        - id: search-service-stream
          uri: ${AI_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/search/stream/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 2

        # Regular search to AI Service
        - id: search-service
          uri: ${AI_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/search/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
                fallbackUri: forward:/fallback/ai-service
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET,POST
                backoff:
                  firstBackoff: 200ms
                  maxBackoff: 1000ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # User Service Routes (/api/v1/users/**)
        # ==============================================
        - id: user-service
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: user-circuit-breaker
                fallbackUri: forward:/fallback/user
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Backend API Routes (/api/v1/**)
        # Catch-all for other backend endpoints
        # ==============================================
        - id: backend-api
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: backend-circuit-breaker
                fallbackUri: forward:/fallback/backend
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Internal API Routes (/internal/v1/**)
        # REMOVED: Internal API는 Docker 네트워크를 통해 직접 통신해야 합니다.
        # 설계서: "내부 네트워크에서만 접근" 명시 (보안 위험으로 Gateway 노출 제거)
        # Backend/AI Service 간 통신은 kp-backend 네트워크에서 직접 수행
        # Ref: architecture_compliance_review_2026-01-26.md Critical C3
        # ==============================================

        # ==============================================
        # AI Service Direct Routes (/ai/**)
        # Legacy AI service endpoints
        # ==============================================
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/ai/**
          filters:
            - TokenRelay=
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
                fallbackUri: forward:/fallback/ai-service
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET,POST

        # ==============================================
        # Keycloak Auth Routes (/auth/**)
        # ==============================================
        - id: keycloak
          uri: ${KEYCLOAK_URL:http://localhost:8180}
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

  # Redis for Rate Limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # Security (OAuth2)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:knowledge-platform}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:knowledge-platform}/protocol/openid-connect/certs

# JWT Configuration (for self-issued HS256 tokens from Direct Login)
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-generation-minimum-32-characters}
  issuer: ${JWT_ISSUER:knowledge-platform}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
      ai-config:
        register-health-indicator: true
        sliding-window-size: 5
        permitted-number-of-calls-in-half-open-state: 2
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 80
    instances:
      auth-circuit-breaker:
        base-config: default
      backend-circuit-breaker:
        base-config: default
      knowledge-circuit-breaker:
        base-config: default
      user-circuit-breaker:
        base-config: default
      ai-service-circuit-breaker:
        base-config: ai-config
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
      ai-timeout:
        timeout-duration: 60s
    instances:
      auth-circuit-breaker:
        timeout-duration: 15s
      backend-circuit-breaker:
        timeout-duration: 30s
      knowledge-circuit-breaker:
        timeout-duration: 30s
      user-circuit-breaker:
        timeout-duration: 15s
      ai-service-circuit-breaker:
        timeout-duration: 60s

# Logging Configuration
logging:
  level:
    root: INFO
    com.knowledge.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost"
              - "http://localhost:80"
              - "${FRONTEND_URL:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        # Auth Service (Docker)
        # Direct login/logout endpoints (no JWT required for login)
        - id: auth-service
          uri: http://backend:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-circuit-breaker
                fallbackUri: forward:/fallback/auth
            - name: Retry
