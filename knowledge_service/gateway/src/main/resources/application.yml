            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1

        # Search Service Stream (Docker)
        - id: search-service-stream
          uri: http://ai-service:8000
          predicates:
            - Path=/api/v1/search/stream/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 2

        # Search Service (Docker)
        - id: search-service
          uri: http://ai-service:8000
          predicates:
            - Path=/api/v1/search/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
                fallbackUri: forward:/fallback/ai-service
            - name: Retry
              args:
