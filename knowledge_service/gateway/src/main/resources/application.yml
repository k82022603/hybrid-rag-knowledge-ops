server:
  port: 8080
  # File Upload Configuration (2GB max)
  max-http-request-header-size: 64KB

spring:
  application:
    name: knowledge-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # File Upload Configuration (2GB max)
  codec:
    max-in-memory-size: 2GB
  webflux:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

  # Cloud Gateway Configuration
  cloud:
    gateway:
      # ==============================================
      # HttpClient Configuration (Connection Pool & Timeouts)
      # SCRUM-62: Netty Channel Error 대응
      # ==============================================
      httpclient:
        connect-timeout: 10000
        response-timeout: 60s
        pool:
          type: elastic
          max-connections: 500
          acquire-timeout: 45000
          max-idle-time: 20000
          evict-in-background: 30s
        wiretap: false  # 프로덕션에서는 false, 디버깅 시 true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # ==============================================
        # Auth Service Routes (/api/auth/** and /api/v1/auth/**)
        # Direct login/logout endpoints (no JWT required for login)
        # ==============================================
        - id: auth-service
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-circuit-breaker
                fallbackUri: forward:/fallback/auth
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: POST
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1

        # Auth Service V1 Routes (/api/v1/auth/**)
        # Same as above but with v1 prefix
        - id: auth-service-v1
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-circuit-breaker
                fallbackUri: forward:/fallback/auth
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: POST
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Document Service Routes (/api/v1/documents/**)
        # Upload, status, list, retry → AI Service
        # ==============================================
        - id: document-service
          uri: ${AI_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/documents/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
                fallbackUri: forward:/fallback/ai-service
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Knowledge Service Routes (/api/v1/knowledge/**)
        # ==============================================
        - id: knowledge-service
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/knowledge/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: knowledge-circuit-breaker
                fallbackUri: forward:/fallback/knowledge
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Search Service Routes (/api/v1/search/**)
        # Streaming search to AI Service
        # ==============================================
        - id: search-service-stream
          uri: ${AI_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/search/stream/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 2

        # Regular search to AI Service
        - id: search-service
          uri: ${AI_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/search/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
                fallbackUri: forward:/fallback/ai-service
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET,POST
                backoff:
                  firstBackoff: 200ms
                  maxBackoff: 1000ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Graph Service Routes (/api/v1/graph/**)
        # Neo4j Knowledge Graph API → AI Service
        # ==============================================
        - id: graph-service
          uri: ${AI_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/graph/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
                fallbackUri: forward:/fallback/ai-service
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET,POST
                backoff:
                  firstBackoff: 200ms
                  maxBackoff: 1000ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # User Service Routes (/api/v1/users/**)
        # ==============================================
        - id: user-service
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: user-circuit-breaker
                fallbackUri: forward:/fallback/user
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Backend API Routes (/api/v1/**)
        # Catch-all for other backend endpoints
        # ==============================================
        - id: backend-api
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/**
          filters:
            - TokenRelay=
            - name: CircuitBreaker
              args:
                name: backend-circuit-breaker
                fallbackUri: forward:/fallback/backend
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1

        # ==============================================
        # Internal API Routes (/internal/v1/**)
        # REMOVED: Internal API는 Docker 네트워크를 통해 직접 통신해야 합니다.
        # 설계서: "내부 네트워크에서만 접근" 명시 (보안 위험으로 Gateway 노출 제거)
        # Backend/AI Service 간 통신은 kp-backend 네트워크에서 직접 수행
        # Ref: architecture_compliance_review_2026-01-26.md Critical C3
        # ==============================================

        # ==============================================
        # AI Service Direct Routes (/ai/**)
        # Legacy AI service endpoints
        # ==============================================
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/ai/**
          filters:
            - TokenRelay=
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: ai-service-circuit-breaker
                fallbackUri: forward:/fallback/ai-service
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT
                methods: GET,POST

        # ==============================================
        # Keycloak Auth Routes (/auth/**)
        # ==============================================
        - id: keycloak
          uri: ${KEYCLOAK_URL:http://localhost:8180}
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

  # Redis for Rate Limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # Security (OAuth2)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:hybrid-rag}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:hybrid-rag}/protocol/openid-connect/certs

# JWT Configuration (for self-issued HS256 tokens from Direct Login)
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-generation-minimum-32-characters}
  issuer: ${JWT_ISSUER:knowledge-platform}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
      ai-config:
        register-health-indicator: true
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        slow-call-duration-threshold: 30s
        slow-call-rate-threshold: 90
    instances:
      auth-circuit-breaker:
        base-config: default
      backend-circuit-breaker:
        base-config: default
      knowledge-circuit-breaker:
        base-config: default
      user-circuit-breaker:
        base-config: default
      ai-service-circuit-breaker:
        base-config: ai-config
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
      ai-timeout:
        timeout-duration: 60s
    instances:
      auth-circuit-breaker:
        timeout-duration: 15s
      backend-circuit-breaker:
        timeout-duration: 30s
      knowledge-circuit-breaker:
        timeout-duration: 30s
      user-circuit-breaker:
        timeout-duration: 15s
      ai-service-circuit-breaker:
        timeout-duration: 60s

# ============================================================
# Logging Configuration
# SCRUM-62: Netty/Reactor 로그 최적화
# ============================================================
# 프로필별 로그 레벨:
# - local (기본): 적절한 디버깅 + 노이즈 필터링
# - dev: 상세 디버깅 (application-dev.yml)
# - prod: 최소 로깅 (application-prod.yml)
# ============================================================
logging:
  level:
    # Application Level
    root: INFO
    com.knowledge.gateway: DEBUG

    # Spring Framework
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.filter: INFO
    org.springframework.security: DEBUG

    # ============================================================
    # Netty & Reactor - Optimized for Local Development
    # ============================================================
    # INFO: 연결 이벤트만 로깅 (DEBUG 대신)
    # Channel 에러 노이즈 필터링 적용
    # ============================================================
    reactor.netty: INFO
    reactor.netty.http.client: INFO
    reactor.netty.http.server: INFO
    io.netty: WARN
    io.netty.channel: WARN
    io.netty.handler: WARN

    # Channel Operation 에러 - 노이즈 감소 (WARN → ERROR)
    # Connection reset, Premature close 등 무시
    reactor.netty.channel.ChannelOperationsHandler: ERROR
    reactor.netty.http.client.HttpClientOperations: ERROR

    # Connection Pool - 연결 라이프사이클 모니터링
    reactor.netty.resources.PooledConnectionProvider: INFO
    reactor.netty.resources.DefaultPooledConnectionProvider: WARN

    # Resilience4j
    io.github.resilience4j: INFO
    io.github.resilience4j.circuitbreaker: INFO

---
# Docker Profile
