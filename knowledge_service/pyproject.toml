[tool.poetry]
name = "knowledge-service"
version = "0.1.0"
description = "Graph RAG based intelligent knowledge search service with LangGraph, Neo4j, and Elasticsearch"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "app", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Core Framework
langgraph = "^1.0.6"
langchain = "^1.2.3"
langchain-core = "^1.2.7"
langchain-community = "^0.4.1"
langchain-openai = "^1.1.7"

# Web Framework
fastapi = "^0.115.0"
uvicorn = {version = "^0.24.0", extras = ["standard"]}
pydantic = {version = "^2.5.0", extras = ["email"]}
pydantic-settings = "^2.1.0"

# Database Clients
psycopg2-binary = "^2.9.0"  # PostgreSQL (sync)
asyncpg = "^0.29.0"         # PostgreSQL (async)
neo4j = "^5.26.0"            # Neo4j 5.26 LTS
elasticsearch = "^8.12.0"    # Elasticsearch 8.x
redis = "^5.0.0"             # Redis (embedding cache)

# LLM & Embedding
openai = "^1.3.0"            # OpenAI API
anthropic = "^0.25.0"        # Anthropic Claude API
requests = "^2.31.0"         # HTTP requests for DeepSeek

# Embedding Models
transformers = "^4.35.0"
torch = "^2.1.0"
sentence-transformers = "^2.2.0"
FlagEmbedding = "^1.2.0"     # BGE-M3 Dense+Sparse 동시 생성 (§14.5 Sparse Vector 필수)
onnxruntime = "^1.17.0"  # SCRUM-102: Reranker ONNX 최적화 (CPU 2-5x 속도 향상)

# Vector/Math
numpy = "^2.1.0"
scikit-learn = "^1.3.0"

# Data Processing
pandas = "^2.1.0"
docling = "^2.60.0"           # Document parsing (PDF, PPTX, DOCX)
python-docx = "^1.1.2"       # Updated to match docling requirement
pypdf = "^5.0.0"
python-pptx = "^1.0.2"       # Updated to match docling requirement

# Utilities
python-dotenv = "^1.0.0"
tenacity = "^8.2.0"          # Retry logic
pydantic-extra-types = "^2.3.0"
tqdm = "^4.66.0"             # Progress bars
httpx = "^0.27.0"            # Async HTTP client

# Authentication
pyjwt = "^2.8.0"             # JWT tokens
passlib = {version = "^1.7.4", extras = ["bcrypt"]}  # Password hashing
bcrypt = ">=4.0,<5.0"  # passlib 1.7.4 호환성: bcrypt 5.x는 detect_wrap_bug() 충돌

# RAG Evaluation
ragas = "^0.1.0"             # RAG evaluation metrics

# Logging & Monitoring
python-json-logger = "^2.0.0"
colorlog = "^6.8.0"
prometheus-fastapi-instrumentator = "^7.0.0"  # Prometheus /metrics endpoint

# Time & Date
pytz = "^2023.3"
python-dateutil = "^2.8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
pytest-timeout = "^2.2.0"
black = "^23.12.0"
isort = "^5.13.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"
pylint = "^3.0.0"

# Testing utilities
faker = "^21.0.0"
factory-boy = "^3.3.0"

# Documentation
sphinx = "^7.2.0"
sphinx-rtd-theme = "^2.0.0"

# Development tools
ipython = "^8.17.0"
jupyter = "^1.0.0"
ipdb = "^0.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
skip_glob = ["*/migrations/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
timeout = 60
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests - STORY-020",
    "slow: slow tests",
    "infrastructure: Infrastructure layer tests (databases, monitoring) - STORY-020",
    "application: Application layer tests (requires app containers) - STORY-020",
    "keycloak: Keycloak authentication tests - STORY-020",
    "evaluation: RAGAS evaluation tests - STORY-058",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "W0212",  # protected-access
    "W0611",  # unused-import
]

[tool.pylint.format]
max-line-length = 100

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "supplemental"
