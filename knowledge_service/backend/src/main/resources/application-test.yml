# Test Profile Configuration
spring:
  r2dbc:
    url: r2dbc:h2:mem:///testdb
    username: sa
    password:

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/test
          jwk-set-uri: http://localhost:8180/realms/test/protocol/openid-connect/certs

# JWT Configuration for tests only - NOT a real secret
jwt:
  secret: TestOnlyJwtSecretKeyForUnitTestsMustBeAtLeast256Bits!!

# Test user initialization (test profile only)
init:
  test-user:
    password: test-password-for-tests-only
  admin:
    password: admin-password-for-tests-only

ai-service:
  url: http://localhost:8000

minio:
  url: http://localhost:9000
  access-key: test-access-key-not-real
  secret-key: test-secret-key-not-real
  bucket: test

logging:
  level:
    root: INFO
    com.knowledge.backend: DEBUG
