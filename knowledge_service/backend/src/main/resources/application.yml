server:
  port: 8081

spring:
  application:
    name: knowledge-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # File Upload Configuration (2GB max)
  codec:
    max-in-memory-size: 2GB
  webflux:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

  # R2DBC Configuration
  r2dbc:
    url: r2dbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:knowledge}
    username: ${DATABASE_USERNAME:knowledge}
    password: ${DATABASE_PASSWORD:password}
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 30m

  # JPA Configuration (for schema generation)
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60s

  # Security (OAuth2 Resource Server)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:knowledge-platform}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:knowledge-platform}/protocol/openid-connect/certs

# Keycloak Client Configuration
keycloak:
  client-id: knowledge-backend
  realm: ${KEYCLOAK_REALM:knowledge-platform}
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8180}

# JWT Configuration (Direct Login)
# SECURITY: JWT_SECRET must be set via environment variable. No default value allowed.
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 3600000  # 1 hour in milliseconds
  refresh-token-expiration: 604800000  # 7 days in milliseconds
  issuer: knowledge-platform

# Auth Configuration
auth:
  max-login-attempts: 5
  lockout-duration-minutes: 15

# AI Service Configuration
ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}
  timeout: 60s

# Elasticsearch Configuration
elasticsearch:
  url: ${ELASTICSEARCH_URL:http://localhost:9200}
  timeout: 10s

# MinIO Configuration
# SECURITY: MinIO credentials must be set via environment variables. No default credentials allowed.
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:documents}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 100
    instances:
      aiService:
        base-config: default
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 5s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
    instances:
      aiService:
        base-config: default
        max-attempts: 3
        wait-duration: 2s
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0s
    instances:
      api:
        limit-for-period: 50
        limit-refresh-period: 1s

# Logging Configuration
logging:
  level:
    root: INFO
    com.knowledge.backend: DEBUG
    org.springframework.r2dbc: DEBUG
    io.r2dbc.postgresql: INFO

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker

  r2dbc:
    url: r2dbc:postgresql://postgresql:5432/${DATABASE_NAME:knowledge}

  data:
    redis:
      host: redis

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/${KEYCLOAK_REALM:knowledge-platform}
          jwk-set-uri: http://keycloak:8080/realms/${KEYCLOAK_REALM:knowledge-platform}/protocol/openid-connect/certs

ai-service:
  url: http://ai-service:8000

elasticsearch:
  url: http://elasticsearch:9200

minio:
  url: http://minio:9000

# Test environment: Relaxed rate limiting
auth:
  max-login-attempts: 1000
  lockout-duration-minutes: 1

logging:
  level:
    root: INFO
    com.knowledge.backend: INFO
